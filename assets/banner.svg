<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #38bdf8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .status-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 13px;
    }

    /* Ambient Pulsing Glow Animations */
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      50% { transform: translate(-30px, 25px) scale(1.2); opacity: 0.5; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .orb-1 { animation: pulseOrb1 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 300px; }
    .stream-line { stroke-dasharray: 6 6; animation: dashStream 2s linear infinite; }
    .floating-card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .status-ping { animation: blinkDot 1.8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmospheric Orbs (Behind everything) -->
  <g>
    <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.35" />
    <circle class="orb-2" cx="1020" cy="310" r="180" fill="#818cf8" filter="url(#glow)" opacity="0.28" />
    <circle cx="650" cy="210" r="100" fill="#c084fc" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Stream Lines / Data Flow in Background -->
  <g opacity="0.45">
    <path class="stream-line" d="M 0 140 Q 300 240 600 120 T 1200 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 0 320 Q 350 200 700 340 T 1200 260" fill="none" stroke="#818cf8" stroke-width="1.8" />
  </g>

  <!-- Left Side: Main Title & Info (strictly foreground, highly legible) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 68)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle class="status-ping" cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="32" y="20" class="tagline-text" font-weight="600">ENTERPRISE &amp; OPEN SOURCE</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="152" class="title-text" fill="url(#primaryGrad)">Automated API Testing</text>
    <text x="0" y="202" class="title-text" fill="#f8fafc">&amp; Validation Suite ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="250" class="subtitle-text">Curated ecosystem for REST, GraphQL, Contract &amp; Load Testing</text>

    <!-- Category Feature Badges -->
    <g transform="translate(0, 288)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="154" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🛡️ Contract Testing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(166, 0)">
        <rect width="144" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🚀 Load &amp; Chaos</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(322, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">📊 Schema Fuzzing</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(502, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">⚡ CI/CD Native</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Decorative Simulated API Inspection Cards (positioned away from text) -->
  <g transform="translate(810, 80)">
    <!-- Card 1 (Top Floating): API Request / Spec Validation -->
    <g class="floating-card-1" filter="url(#cardShadow)">
      <rect width="320" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="20" cy="22" r="5" fill="#ef4444" opacity="0.8" />
      <circle cx="36" cy="22" r="5" fill="#eab308" opacity="0.8" />
      <circle cx="52" cy="22" r="5" fill="#22c55e" opacity="0.8" />
      <text x="210" y="25" fill="#64748b" font-size="11" font-family="monospace">VALIDATION</text>
      
      <rect x="18" y="44" width="56" height="22" rx="4" fill="#065f46" />
      <text x="26" y="59" fill="#34d399" class="status-code">POST</text>
      <text x="84" y="59" fill="#f1f5f9" font-family="monospace" font-size="13">/api/v2/verify-schema</text>

      <rect x="18" y="78" width="60" height="18" rx="4" fill="#1e1e38" />
      <text x="24" y="91" fill="#38bdf8" class="status-code">200 OK</text>
      <text x="90" y="91" fill="#94a3b8" font-family="monospace" font-size="11">Schema Matched (14ms)</text>
    </g>

    <!-- Card 2 (Bottom Floating): Contract / Assertion Stats -->
    <g class="floating-card-2" transform="translate(20, 134)" filter="url(#cardShadow)">
      <rect width="310" height="100" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
      <text x="20" y="28" fill="#a78bfa" font-weight="700" font-size="12" font-family="monospace">Pact Contract Verification</text>
      <path d="M 20 40 L 290 40" stroke="#334155" stroke-width="1" />
      
      <text x="20" y="62" fill="#22c55e" font-size="12" font-family="monospace">✓ Consumer Contract</text>
      <text x="235" y="62" fill="#22c55e" font-size="12" font-family="monospace">PASSED</text>
      
      <text x="20" y="84" fill="#22c55e" font-size="12" font-family="monospace">✓ Mock Provider Synced</text>
      <text x="235" y="84" fill="#38bdf8" font-size="12" font-family="monospace">100%</text>
    </g>
  </g>
</svg>
